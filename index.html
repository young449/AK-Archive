<style>
:root {
  --n-900:#121212;--n-800:#1A1A1A;--n-700:#292929;
  --n-600:#3A3A3A;--n-500:#595959;--n-400:#6C6C6C;--n-300:#949494;
  --cr-900:#720B1C;--cr-700:#CC1B38;--cr-200:#E7727F;--cr-100:#F09AA3;
  --a-w100:rgba(255,255,255,1);--a-w50:rgba(255,255,255,0.5);
  --a-w30:rgba(255,255,255,0.3);--a-w10:rgba(255,255,255,0.1);
  --a-w06:rgba(255,255,255,0.06);
  --text-1:var(--a-w100);--text-2:var(--a-w50);--text-3:var(--a-w30);
  --div-1:var(--n-700);--div-2:var(--n-600);
  --cat-model-bg:rgba(0,123,255,0.12);--cat-model:#5AABFF;
  --cat-hist-bg:rgba(204,27,56,0.14);--cat-hist:var(--cr-100);
  --cat-design-bg:rgba(27,204,163,0.12);--cat-design:#1BCCA3;
  --cat-gloss-bg:rgba(255,187,0,0.10);--cat-gloss:#FFBB00;
  --chip-ultima-bg:rgba(204,27,56,0.16);--chip-ultima:var(--cr-200);
  --chip-pd-bg:rgba(0,123,255,0.14);--chip-pd:#6DB8FF;
  --chip-her-bg:rgba(255,187,0,0.10);--chip-her:#FFBB00;
  --chip-cl-bg:rgba(149,149,149,0.1);--chip-cl:#A0A0A0;
  --chip-sp3000-bg:rgba(216,90,48,0.13);--chip-sp3000:#B8501E;
  --chip-sp4000t-bg:rgba(163,106,255,0.14);--chip-sp4000t:#C49DFF;
  --chip-pd-bg:rgba(55,138,221,0.12);--chip-pd:#378ADD;
  --chip-rc-bg:rgba(27,204,163,0.12);--chip-rc:#1BCCA3;
  --chip-research-bg:rgba(0,231,250,0.12);--chip-research:#00E7FA;
  --chip-others-bg:rgba(160,160,160,0.12);--chip-others:#A0A0A0;
  --font:"Pretendard Variable","Pretendard",sans-serif;
  --mono:var(--font);
  --r-xs:4px;--r-sm:6px;--r-lg:16px;--r-xl:999px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:var(--font);background:var(--n-900);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* =============================================
   SECTION: css-top-btn
============================================= */
#top-btn{
  position:fixed;right:36px;bottom:80px;z-index:500;
  width:52px;height:52px;border-radius:50%;
  background:var(--n-700);border:1px solid var(--div-2);
  color:var(--text-2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 16px rgba(0,0,0,0.4);
  opacity:0;pointer-events:none;
  transform:translateY(8px);
  transition:opacity 0.2s,transform 0.2s,background 0.13s,color 0.13s;
}
#top-btn.show{opacity:1;pointer-events:auto;transform:translateY(0)}
#top-btn:hover{background:var(--n-600);color:var(--text-1)}
body.is-home #top-btn{display:none}
@media(max-width:639px){
  #top-btn{right:16px;bottom:64px;width:44px;height:44px}
}

/* =============================================
   SECTION: css-gnb
   항상 표시. 홈에서는 숨김 (body.is-home)
============================================= */
#gnb-wrap{
  position:sticky;top:0;z-index:200;
  padding:40px 0 10px;
  background:transparent;
  display:flex;
  justify-content:center;
}
body.is-home #gnb-wrap{
  position:fixed;top:0;left:0;right:0;
  background:transparent;
  z-index:200;
}

#gnb-inner{
  display:inline-flex;align-items:center;gap:2px;
  background:rgba(26,26,26,0.72);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--div-2);
  border-radius:var(--r-xl);
  padding:8px 12px;
}
/* 데스크탑: inner-row는 그냥 투명 컨테이너 */
#gnb-inner-row{
  display:contents;
}
#gnb-logo{
  display:flex;align-items:center;gap:9px;
  flex-shrink:0;padding:4px 12px 4px 6px;
  border-radius:var(--r-xl);transition:background 0.14s;
}
#gnb-logo:hover{background:transparent}
#gnb-logo img{width:22px;height:auto;mix-blend-mode:screen}
#gnb-logo-text{
  font-family:var(--font);font-size:14px;font-weight:700;
  color:var(--text-1);letter-spacing:0.06em;white-space:nowrap;
}
.gnb-tab{
  padding:12px 20px;font-size:14px;font-weight:500;
  color:var(--text-2);border-radius:var(--r-xl);
  transition:color 0.13s, background 0.13s;white-space:nowrap;
}
.gnb-tab:hover{color:var(--text-1)}
.gnb-tab.is-active{color:var(--text-1);background:var(--a-w10)}
/* 로고와 메뉴 사이 구분선 — 폰트 높이, 은은하게 */
.gnb-divider{width:1px;height:14px;flex-shrink:0;margin:0 6px;align-self:center;background:var(--div-2)}

/* 햄버거 버튼 — 모바일 전용, 데스크탑에서 숨김 */
#gnb-hamburger{
  display:none;
  align-items:center;justify-content:center;
  width:56px;height:56px;
  flex-shrink:0;
  color:var(--text-1);
  border-radius:var(--r-xl);
  transition:background 0.13s;
}
#gnb-hamburger:hover{}
#gnb-hamburger svg{width:24px;height:24px}

/* =============================================
   SECTION: css-gnb-drawer
   모바일 드로어 — pill 내부에서 아래로 확장
============================================= */

/* 오버레이: 클릭 감지용 (딤 없음) */
#gnb-drawer-overlay{
  display:none;
  position:fixed;inset:0;
  z-index:199;
}
#gnb-drawer-overlay.open{display:block}

/* 드로어 nav: 기본 숨김, 열리면 펼침 */
#gnb-drawer{
  display:none;
  flex-direction:column;
  padding:4px 12px 16px;
}
#gnb-drawer.open{display:flex}

/* 드로어 헤더: pill 안의 별도 행 — 모바일에서만 표시 */
#gnb-drawer-header{display:none}

#gnb-drawer-logo{
  display:flex;align-items:center;gap:9px;
  font-size:14px;font-weight:700;
  color:var(--text-1);letter-spacing:0.06em;
}
#gnb-drawer-logo img{width:22px;height:auto;mix-blend-mode:screen}
#gnb-drawer-close{
  display:flex;align-items:center;justify-content:center;
  width:56px;height:56px;
  color:var(--text-1);
  border-radius:var(--r-xl);
  transition:background 0.13s,color 0.13s;
  flex-shrink:0;
}
#gnb-drawer-close:hover{color:var(--text-1)}
#gnb-drawer-close svg{width:24px;height:24px}

#gnb-drawer-nav{
  display:flex;flex-direction:column;
  gap:0;
}
.gnb-drawer-item{
  display:flex;align-items:center;
  justify-content:center;
  height:40px;
  padding:0 12px;
  font-size:16px;font-weight:500;
  color:var(--text-2);
  border-radius:8px;
  transition:color 0.13s;
  text-align:center;
  width:100%;
}
.gnb-drawer-item:hover{color:var(--text-1)}
.gnb-drawer-item.is-active{
  color:var(--text-1);
  font-weight:600;
}

/* ── 모바일: pill이 좌우로 꽉 참 ── */
@media (max-width: 639px) {
  /* 항상 fixed — sticky↔fixed 전환 자체를 없애 레이아웃 이동 방지 */
  #gnb-wrap{
    position:fixed;top:0;left:0;right:0;
    padding:28px 16px 10px;
    z-index:200;
  }
  body.is-home #gnb-wrap{
    padding:28px 16px 10px;
  }
  /* gnb-wrap이 항상 fixed이므로 list/tag 페이지에 항상 padding 보상 */
  #list-page{ padding-top:94px; }
  #tag-page{  padding-top:94px; }
  /* pill이 드로어 컨테이너 역할 — flex-direction: column으로 전환 */
  #gnb-inner{
    width:100%;
    flex-direction:column;
    align-items:stretch;
    padding:0;
    gap:0;
  }
  /* pill 상단 행: 로고 + 햄버거/닫기 */
  #gnb-inner-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    height:56px;
    padding:0 0 0 8px;
  }
  #gnb-logo{
    height:56px;
    padding:0 18px 0 12px;
    gap:8px;
  }
  #gnb-logo img{width:22px}
  #gnb-logo-text{font-size:14px}
  .gnb-tab{display:none}
  .gnb-divider{display:none}
  #gnb-hamburger{display:flex}
  /* 드로어 열렸을 때 pill radius 축소 */
  #gnb-inner.drawer-open{
    border-radius:20px;
  }
}

/* =============================================
   SECTION: css-home
   body.is-home일 때만 표시
============================================= */
#home{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;gap:32px;position:relative;overflow:hidden}
body.is-home #home{display:flex}

#home-copy{text-align:center;position:relative;z-index:1}
#home-headline{font-size:32px;font-weight:600;color:var(--text-1);line-height:1.3;letter-spacing:-0.02em;margin-bottom:8px}
#home-subline{font-size:16px;font-weight:400;color:var(--text-2);line-height:1.5}

#home-search-wrap{width:100%;max-width:480px;position:relative;z-index:1}
#home-search{
  width:100%;height:52px;padding:0 48px 0 50px;
  background:var(--n-800);border:1px solid var(--div-2);
  border-radius:16px;color:var(--text-1);
  font-family:var(--font);font-size:16px;outline:none;
  transition:border-color 0.15s,box-shadow 0.15s;
}
#home-search::placeholder{color:var(--n-500)}
#home-search::-webkit-search-cancel-button{display:none;-webkit-appearance:none;appearance:none}
#home-search::-ms-clear{display:none}
#home-search:focus{border:2px solid rgba(204,27,56,0.5);box-shadow:0 0 12px rgba(204,27,56,0.10)}
.home-si{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--n-500);pointer-events:none}
#home-clear{
  position:absolute;right:15px;top:50%;transform:translateY(-50%);
  width:22px;height:22px;border-radius:50%;
  background:var(--n-600);color:var(--text-2);
  display:none;align-items:center;justify-content:center;
}
#home-clear.show{display:flex}

/* =============================================
   SECTION: css-autocomplete
============================================= */
#home-autocomplete{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  background:var(--n-800);border:1px solid var(--div-2);
  border-radius:14px;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,0.45);
  z-index:300;
  display:none;
}
#home-autocomplete.show{display:block}
.ac-item{
  display:flex;align-items:center;gap:10px;
  padding:13px 18px;cursor:pointer;
  transition:background 0.1s;
}
.ac-item:hover,.ac-item.is-focused{background:var(--n-700)}
.ac-item-icon{
  flex-shrink:0;color:var(--n-400);
}
.ac-item-content{flex:1;min-width:0}
.ac-item-title{
  font-size:15px;font-weight:500;color:var(--text-1);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.35;
}
.ac-item-title mark{
  background:transparent;color:var(--cr-200);
  border-radius:0;padding:0;font-style:normal;font-weight:600;
}
.ac-item-meta{
  font-size:12px;color:var(--n-400);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ac-item-badge{
  flex-shrink:0;
  font-size:11px;font-weight:500;padding:2px 7px;
  border-radius:var(--r-xs);
  background:var(--a-w06);color:var(--n-400);
  border:1px solid var(--div-1);
}
.ac-footer{
  padding:10px 18px;
  border-top:1px solid var(--div-1);
  font-size:13px;color:var(--n-400);
  display:flex;align-items:center;gap:6px;
  cursor:pointer;transition:background 0.1s;
}
.ac-footer:hover{background:var(--n-700)}
.ac-footer strong{color:var(--text-2);font-weight:500}
.ac-history-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 6px;
}
.ac-history-label{font-size:11px;font-weight:600;color:var(--n-400);letter-spacing:0.06em;text-transform:uppercase}
.ac-history-clear{font-size:12px;color:var(--n-400);background:none;border:none;cursor:pointer;font-family:var(--font);padding:0;transition:color 0.12s}
.ac-history-clear:hover{color:var(--text-2)}
.ac-item-del{
  flex-shrink:0;width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--n-500);background:none;border:none;cursor:pointer;
  font-family:var(--font);opacity:0;transition:opacity 0.1s,background 0.1s;
}
.ac-item:hover .ac-item-del{opacity:1}
.ac-item-del:hover{background:var(--n-600);color:var(--text-2)}

/* =============================================
   SECTION: css-list
   body.is-list일 때 표시
============================================= */
#list-page{display:none;flex-direction:column;min-height:calc(100vh - 62px)}
body.is-list #list-page{display:flex}

#list-content{flex:1;max-width:960px;margin:0 auto;width:100%;padding:40px 24px 80px}
#hero{margin-bottom:34px}
#hero-title{font-size:24px;font-weight:600;color:var(--text-1);margin-bottom:8px}
#hero-desc{font-size:16px;color:var(--text-2)}
#hero-scope{display:none;font-size:16px;color:var(--text-2);line-height:1.5;margin-top:6px}
#hero-scope.show{display:block}

/* =============================================
   SECTION: css-chip-bar
============================================= */
#chip-bar{display:flex;align-items:center;gap:0;margin-bottom:34px;}

/* 탭 스크롤 영역 */
#chip-scroll{
  display:flex;align-items:center;gap:6px;
  flex:1;min-width:0;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
  padding-right:8px;
}
#chip-scroll::-webkit-scrollbar{display:none}

/* 우측 페이드 — 모바일에서만 표시 */
#chip-bar{position:relative;}
#chip-bar::after{display:none;}
@media(max-width:639px){
  #chip-bar::after{
    content:"";
    display:block;
    position:absolute;
    right:34px;top:0;bottom:0;width:32px;
    background:linear-gradient(to right, transparent, var(--page-bg, #111));
    pointer-events:none;
    z-index:1;
  }
}
.chip-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 16px;border-radius:var(--r-xl);
  font-size:15px;font-weight:500;
  color:var(--text-2);background:var(--n-800);
  border:1px solid var(--div-2);
  transition:all 0.13s;white-space:nowrap;
  flex-shrink:0;
}
.chip-btn:hover{color:var(--text-1);background:var(--n-700);border-color:var(--n-500)}
.chip-btn.is-active{color:#fff;background:var(--cr-700);border-color:var(--cr-700)}
.chip-btn.is-active[data-chip="A&ultima"]{background:var(--chip-ultima-bg);border-color:var(--chip-ultima);color:var(--chip-ultima)}
.chip-btn.is-active[data-chip="PD series"]{background:var(--chip-pd-bg);border-color:var(--chip-pd);color:var(--chip-pd)}
.chip-btn.is-active[data-chip="RC"]{background:var(--chip-rc-bg);border-color:var(--chip-rc);color:var(--chip-rc)}
.chip-btn.is-active[data-chip="Research"]{background:var(--chip-research-bg);border-color:var(--chip-research);color:var(--chip-research)}
.chip-btn.is-active[data-chip="Others"]{background:var(--chip-others-bg);border-color:var(--chip-others);color:var(--chip-others)}
.chip-btn.is-active[data-chip="Heritage"]{background:var(--chip-her-bg);border-color:var(--chip-her);color:var(--chip-her)}
.chip-btn.is-active[data-chip="Classic"]{background:var(--chip-cl-bg);border-color:var(--chip-cl);color:var(--chip-cl)}
.chip-btn.is-active[data-chip="SP4000"]{background:var(--chip-sp4000t-bg);border-color:var(--chip-sp4000t);color:var(--chip-sp4000t)}
.chip-btn.is-active[data-chip="SP4000T"]{background:var(--chip-sp4000t-bg);border-color:var(--chip-sp4000t);color:var(--chip-sp4000t)}
.chip-btn .cnt{font-size:12px;font-family:var(--mono);opacity:0.7}
.gloss-stab .cnt{font-size:12px;font-family:var(--mono);opacity:0.7}
#chip-search-wrap{position:relative;flex-shrink:0}
/* 검색 필드 상태 가이드
   Default : bg n-800 / border div-2(n-600) / placeholder n-500 / icon n-500
   Active  : bg n-700 / border n-400       / placeholder n-500 / icon n-400
*/
#chip-search{
  width:170px;height:36px;padding:0 12px 0 32px;
  background:var(--n-800);border:1px solid var(--div-2);
  border-radius:var(--r-xl);color:var(--text-1);
  font-family:var(--font);font-size:14px;outline:none;
  transition:background 0.13s,border-color 0.13s,width 0.2s;
}
#chip-search::placeholder{color:var(--n-500)}
#chip-search:focus{
  background:var(--n-700);
  border-color:var(--n-400);
}
#chip-search:focus ~ .csi,
#chip-search:focus + .csi{ color:var(--n-400); }
.csi{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--n-500);pointer-events:none;transition:color 0.13s;}
#chip-search-icon{display:none}
#chip-search-close{display:none}

/* 데스크톱: 네이티브 검색취소(파란 X) 숨기고 동그란 clear 버튼 사용 */
#chip-search::-webkit-search-cancel-button{display:none;-webkit-appearance:none;appearance:none}
#chip-search::-ms-clear{display:none}
@media(min-width:640px){
  #chip-search{padding-right:30px}
  #chip-search-clear{
    display:none;align-items:center;justify-content:center;
    width:16px;height:16px;padding:2px;box-sizing:content-box;
    background:var(--n-600);border:none;border-radius:50%;color:var(--n-300);
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    z-index:2;cursor:pointer;
  }
  #chip-search-clear svg{width:8px;height:8px}
  #chip-search-clear.show{display:flex}
}

/* 모바일: 검색 input 숨기고 아이콘 버튼만 표시 */
@media(max-width:639px){
  #chip-search{ display:none; }
  .csi{ display:none; }
  #chip-search-wrap{
    display:flex;align-items:center;justify-content:center;
    width:34px;height:34px;flex-shrink:0;
    background:var(--n-800);
    border:1px solid var(--div-2);
    border-radius:10px;
    cursor:pointer;
  }
  #chip-search-icon{
    display:flex;align-items:center;justify-content:center;
    color:var(--n-400);
    pointer-events:none;
  }

  /* 검색 확장 상태 */
  #chip-bar.search-open #chip-scroll{ display:none; }
  #chip-bar.search-open::after{ display:none; }
  #chip-bar.search-open #chip-search-wrap{
    flex:1;width:auto;height:34px;
    border-radius:var(--r-xl);
    justify-content:flex-start;
    padding:0 12px 0 36px;
    position:relative;
    background:var(--n-700);
    border-color:var(--n-400);
  }
  #chip-bar.search-open #chip-search-icon{ display:none; }
  #chip-bar.search-open .csi{
    display:block;
    left:12px;
    color:var(--n-400);
  }
  #chip-bar.search-open #chip-search{
    display:block;
    width:100%;height:100%;
    background:transparent;border:none;
    padding:0 40px 0 0;font-size:15px;
  }
  #chip-bar.search-open #chip-search::-webkit-search-cancel-button{ display:none; }
  #chip-bar.search-open #chip-search::-ms-clear{ display:none; }
  /* 원형 X — 필드 안 우측 */
  #chip-search-clear{
    display:none;
    align-items:center;justify-content:center;
    width:16px;height:16px;
    background:var(--n-600);border-radius:50%;
    color:var(--n-300);
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    z-index:2;flex-shrink:0;
    padding:2px;box-sizing:content-box;
  }
  #chip-search-clear svg{ width:8px;height:8px; }
  #chip-bar.search-open #chip-search-clear{ display:flex; }

  /* 그냥 X — 필드 밖 */
  #chip-search-close{
    display:none;
    align-items:center;justify-content:center;
    width:34px;height:34px;flex-shrink:0;
    color:var(--text-2);
  }
  #chip-search-close svg{ width:16px;height:16px; }
  #chip-bar.search-open #chip-search-close{ display:flex; }
}

/* =============================================
   SECTION: css-count + card
============================================= */
#count-row{margin-bottom:12px}
#count-text{font-size:14px;color:var(--text-2)}
#count-num{font-family:var(--mono);color:var(--text-1)}
#card-list{display:flex;flex-direction:column;gap:12px}
.card{

  border-radius:var(--r-lg);padding:28px 24px;cursor:pointer;
  display:flex;flex-direction:column;gap:0;
  transition:background 0.12s,border-color 0.12s;
}
.card:hover{background:var(--n-700);border-color:var(--div-2)}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.card-top:empty{display:none;margin-bottom:0;}
.card-models-row{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.card-title{font-size:18px;font-weight:600;color:var(--text-1);line-height:1.4;margin-bottom:8px;}
.card-meta{display:flex;align-items:center;gap:6px}
.card-meta-author{font-size:14px;font-weight:500;color:var(--text-2)}
.card-meta-sep{font-size:14px;color:var(--n-600)}
.card-meta-date{font-size:14px;color:var(--n-500)}

/* =============================================
   SECTION: css-thumbnail-grid
   제품 모델 카테고리 전용 썸네일 그리드
============================================= */
#card-list.is-thumb-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
/* Tablet-S: 2열 */
@media(max-width:768px){
  #card-list.is-thumb-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
}
/* Mobile: 1열 */
@media(max-width:480px){
  #card-list.is-thumb-grid{grid-template-columns:1fr;}
}
/* Mobile-XS: 1열 */
@media(max-width:360px){
  #card-list.is-thumb-grid{grid-template-columns:1fr;}
}

/* 일반 카드 리스트 (UX 히스토리 / AK 용어) */
/* Desktop: gap 12px — 기본값 */
/* Tablet-S */
@media(max-width:768px){
  #card-list.is-thumb-grid{gap:16px;}
  .card{padding:20px 18px;}
}
/* Mobile */
@media(max-width:480px){
  #card-list{gap:16px;}
  #card-list.is-thumb-grid{grid-template-columns:1fr;gap:16px;}
}
/* Mobile-XS */
@media(max-width:360px){
  #card-list{gap:16px;}
  #card-list.is-thumb-grid{grid-template-columns:1fr;gap:16px;}
}
.card-thumb{

/* =============================================
   SECTION: css-responsive
   브레이크포인트 설계
   ─ Desktop     : ≥ 960px  (기본값)
   ─ Tablet      : < 960px
   ─ Tablet-S    : < 768px
   ─ Mobile-L    : < 640px
   ─ Mobile      : < 480px
   ─ Mobile-XS   : < 360px
============================================= */

body.is-tag #detail[style*="block"] {
  max-width: 960px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}
@media (max-width: 767px) {
  body.is-tag #detail[style*="block"] { padding: 24px 16px 72px }
}
@media (max-width: 639px) {
  body.is-tag #detail[style*="block"] { padding: 20px 16px 60px }

<script>
/* =============================================
   SECTION: home-wave
   홈 화면에만 재생되는 soundwave 배경 애니메이션
============================================= */
(function(){
  const canvas = document.getElementById('home-wave');
  const ctx = canvas.getContext('2d');
  let W, H, t = 0, raf = null;

  const smooth = [];

  function resize(){
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    const barW = 2, gap = 2, unit = barW + gap;
    const n    = Math.ceil(W / unit) + 1;
    const cy   = H * 0.60;   // 검색필드 중심
    const maxH = H * 0.22;   // 각 파동 최대 높이 (두 개니까 절반으로)

    if(smooth.length === 0){
      for(let i = 0; i < n; i++){
        const pos = i / (n - 1);
        const e = 0.55 + 0.45 * Math.pow(Math.sin(pos * Math.PI), 1.5);
        smooth[i]       = e * 0.5;  // 파동1 (위)
        smooth[n + i]   = e * 0.5;  // 파동2 (아래)
      }
    }

    for(let i = 0; i < n; i++){
      const pos = i / (n - 1);
      const envelope = 0.55 + 0.45 * Math.pow(Math.sin(pos * Math.PI), 1.5);
      const x = i * unit;
      const alpha = 0.15 + envelope * 0.42;

      // ── 파동 1: 느린 파동 (위쪽으로 뻗음)
      const wave1 = Math.sin(t * 0.014 + pos * Math.PI * 2.0) * 0.52 +
                    Math.sin(t * 0.022 + pos * Math.PI * 5.0) * 0.28 + 0.5;
      const target1 = (0.15 + wave1 * 0.72) * envelope;
      if(smooth[i] === undefined) smooth[i] = target1;
      smooth[i] += (target1 - smooth[i]) * 0.06;
      const bh1 = smooth[i] * maxH;

      // 파동1: cy 위쪽에 피크, 위아래로 자연스럽게 페이드
      const grad1 = ctx.createLinearGradient(0, cy - bh1, 0, cy + bh1 * 0.3);
      grad1.addColorStop(0,    `rgba(215,38,58,0)`);
      grad1.addColorStop(0.35, `rgba(225,45,65,${alpha})`);
      grad1.addColorStop(1.0,  `rgba(215,38,58,0)`);
      ctx.fillStyle = grad1;
      ctx.beginPath();
      ctx.roundRect(x, cy - bh1, barW, bh1 * 1.3, 1);
      ctx.fill();

      // ── 파동 2: 위상 다르게, cy 아래쪽에 피크
      const wave2 = Math.sin(t * 0.018 + pos * Math.PI * 2.8 + 1.2) * 0.52 +
                    Math.sin(t * 0.026 + pos * Math.PI * 5.6 + 0.8) * 0.28 + 0.5;
      const target2 = (0.15 + wave2 * 0.72) * envelope;
      if(smooth[n + i] === undefined) smooth[n + i] = target2;
      smooth[n + i] += (target2 - smooth[n + i]) * 0.06;
      const bh2 = smooth[n + i] * maxH;

      // 파동2: cy 아래쪽에 피크, 위아래로 자연스럽게 페이드
      const grad2 = ctx.createLinearGradient(0, cy - bh2 * 0.3, 0, cy + bh2);
      grad2.addColorStop(0,    `rgba(215,38,58,0)`);
      grad2.addColorStop(0.65, `rgba(225,45,65,${alpha})`);
      grad2.addColorStop(1.0,  `rgba(215,38,58,0)`);
      ctx.fillStyle = grad2;
      ctx.beginPath();
      ctx.roundRect(x, cy - bh2 * 0.3, barW, bh2 * 1.3, 1);
      ctx.fill();
    }
    t++;
    raf = requestAnimationFrame(draw);
  }

  function startWave(){
    if(!raf){
      canvas.style.display = 'block';
      resize(); draw();
    }
  }
  function stopWave(){
    if(raf){ cancelAnimationFrame(raf); raf = null; t = 0; }
    ctx.clearRect(0, 0, W, H);
    canvas.style.display = 'none';
  }

  resize();
  window.addEventListener('resize', resize);

  // body 클래스 변화 감지 → is-home일 때만 실행
  const observer = new MutationObserver(() => {
    if(document.body.classList.contains('is-home')) startWave();
    else stopWave();
  });
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

  // 초기 상태
  if(document.body.classList.contains('is-home')) startWave();
})();
</script>

const CAT_CLS = {"제품 모델":"b-model","기능 히스토리":"b-hist","디자인 가이드":"b-design","용어사전":"b-gloss"};
const HERO = {
  "전체":{title:"전체",desc:"프로젝트 히스토리, 의사결정 배경, 사내 용어를 키워드 하나로 즉시 탐색"},
  "제품 모델":{title:"제품",desc:"모델별 사양과 신기능을 확인하세요."},
  "기능 히스토리":{title:"UX 히스토리",desc:"기능의 의사결정 배경과 변경 이력을 확인하세요."},
  "디자인 가이드":{title:"디자인 가이드",desc:"컴포넌트 스펙, 컬러 토큰, 가이드라인 문서"},
  "용어사전":{title:"AK 용어",desc:"DAP 시장과 AK 서비스의 주요 용어를 확인하세요."},
};
const DATA = [...DATA_product, ...DATA_ux, ...DATA_glossary];
</script>

<script>
const S = {cat:"",chip:"전체",q:"",openId:null,tag:"",glossTab:"전체"};
// 초기 히스토리 상태 설정 (뒤로가기 기준점)
history.replaceState({page:"home"}, "");

/* =============================================
   SECTION: js-tag-page
============================================= */
function goTag(tag) { _goTag(tag, true); }
function _goTag(tag, push) {
  if (push) pushHistory({page:"tag", tag});
  S.tag = tag;
  // 모든 페이지 숨김
  document.body.className = "is-tag";
  // 상세 오버레이 흔적 제거 (상세→태그 복귀 시 깨끗하게)
  const _dvt=document.getElementById("detail");
  _dvt.classList.remove("show");_dvt.setAttribute("aria-hidden","true");
  _dvt.style.display="";_dvt.style.maxWidth="";_dvt.style.margin="";_dvt.style.padding="";
  const _tct=document.getElementById("tag-content");if(_tct)_tct.style.display="";
  S.openId=null;
  document.getElementById("gnb-wrap").style.display = "";
  document.querySelectorAll(".gnb-tab").forEach(t=>t.classList.remove("is-active"));
  // 태그 히어로
  document.getElementById("tag-hero-title").textContent = tag;
  const items = DATA.filter(d => d.tags.includes(tag));
  document.getElementById("tag-hero-count").textContent = `${items.length}개의 항목`;
  // 카드 렌더링
  renderTagCards(items, tag);
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderTagCards(items, tag) {
  const list = document.getElementById("tag-card-list");
  list.innerHTML = "";
  if(items.length === 0){
    list.innerHTML = `<p style="font-size:15px;color:var(--n-500);padding:40px 0">해당 태그를 가진 항목이 없습니다.</p>`;
    return;
  }
  items.forEach(d => {
    const el = document.createElement("div");
    el.className = "card";
    const catCls = CAT_CLS[d.category]||"b-model";
    const dp = d.date.split(".");
    const fmtDate = dp.length===3 ? `${dp[0]}. ${parseInt(dp[1])}. ${parseInt(dp[2])}.` : d.date;
    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
        <span class="badge ${catCls}">${d.category}</span>
      </div>
      <div class="card-title">${d.title}</div>
      <div class="card-meta">
        <span class="card-meta-author">${d.author}</span>
        <span class="card-meta-sep">·</span>
        <span class="card-meta-date">${fmtDate}</span>
      </div>
    `;
    el.addEventListener("click", () => {
      S.prevTag = tag;
      openDetailFromTag(d.id);
    });
    list.appendChild(el);
  });
}

function openDetailFromTag(id) {
  // 상세는 list-page 컨테이너에서 표시하고, 직전 페이지를 태그로 기록.
  // 목록으로/뒤로가기 시 history.back()이 태그 목록으로 복귀시킨다.
  openDetail(id, "is-tag");
}


/* =============================================
   SECTION: js-history
   브라우저 뒤로가기/앞으로가기 지원
============================================= */
// 카테고리 ↔ URL 슬러그 매핑 (주소창 링크를 깔끔한 영문으로)
const CAT_SLUG = {
  "제품 모델":    "product",
  "기능 히스토리": "uxhistory",
  "용어사전":     "akglossary",
};
const SLUG_CAT = Object.fromEntries(Object.entries(CAT_SLUG).map(([k,v])=>[v,k]));
function catToSlug(cat){ return CAT_SLUG[cat] || encodeURIComponent(cat || ""); }
// 신규 영문 슬러그 우선, 없으면 구 한글 링크(인코딩)도 그대로 해석 → 기존 공유 링크 호환
function slugToCat(slug){ return SLUG_CAT[slug] || decodeURIComponent(slug); }

// 상태 → 주소창에 표시할 해시 URL 변환 (항목/페이지별 고유 링크 생성)
function hashForState(state) {
  if (!state) return location.pathname + location.search;
  if (state.page === "home")   return location.pathname + location.search; // 홈은 해시 없는 깔끔한 주소
  if (state.page === "detail") {
    const d = DATA.find(x => x.id === state.id);
    if (!d || !CAT_SLUG[d.category]) return "#/doc/" + state.id; // 미매핑 카테고리는 기존 방식
    const slug = CAT_SLUG[d.category];
    // 제품은 제품명, 그 외(UX 히스토리·용어)는 번호 노출
    const key = (d.category === "제품 모델") ? encodeURIComponent(d.title) : state.id;
    return "#/" + slug + "/" + key;
  }
  if (state.page === "tag")    return "#/tag/" + encodeURIComponent(state.tag);
  if (state.page === "list")   return state.q
    ? "#/search/" + encodeURIComponent(state.q)
    : "#/" + catToSlug(state.cat);
  return location.pathname + location.search;
}
function pushHistory(state) {
  history.pushState(state, "", hashForState(state));
}
function replaceHistory(state) {
  history.replaceState(state, "", hashForState(state));
}

window.addEventListener("popstate", e => {
  const st = e.state;
  if (!st) { _goHome(false); return; }
  if (st.page === "home")   { _goHome(false); return; }
  if (st.page === "list")   { _goList(st.cat, st.q, false); return; }
  if (st.page === "detail") { _openDetail(st.id, st.prevPage, false); return; }
  if (st.page === "tag")    { _goTag(st.tag, false); return; }
});

/* =============================================
   SECTION: js-page-switch
   body 클래스로 페이지 전환
============================================= */
function goHome() { _goHome(true); }
function _goHome(push) {
  if (push) pushHistory({page:"home"});
  document.body.className = "is-home";
  document.getElementById("home-search").value = "";
  document.getElementById("home-clear").classList.remove("show");
  document.querySelectorAll(".gnb-tab").forEach(t=>t.classList.remove("is-active"));
  S.cat="";S.chip="전체";S.q="";S.openId=null;
  window.scrollTo({top:0,behavior:"smooth"});
}

function goList(cat, q) { _goList(cat, q, true); }
function _goList(cat, q, push) {
  if (push) pushHistory({page:"list", cat, q:q||""});
  document.body.className = "is-list";
  S.prevCat=S.cat; S.cat=cat; S.chip="전체"; S.q=q||""; S.openId=null;
  if(cat !== "용어사전") S.glossTab = "전체";
  // 항상 list UI 복구 (태그 페이지에서 올 때도 포함)
  ["card-list","count-row","hero"].forEach(i=>{
    const el=document.getElementById(i);
    if(el) el.style.display="";
  });
  document.getElementById("chip-bar").style.display="flex";
  // detail 숨김
  const dv=document.getElementById("detail");
  dv.classList.remove("show");dv.setAttribute("aria-hidden","true");
  dv.style.display=""; dv.style.maxWidth=""; dv.style.margin=""; dv.style.padding="";
  // thumb grid 초기화
  document.getElementById("card-list").classList.remove("is-thumb-grid");
  // tag-content 복구
  const tc=document.getElementById("tag-content");
  if(tc) tc.style.display="";
  // GNB 탭 동기화
  document.querySelectorAll(".gnb-tab").forEach(t=>
    t.classList.toggle("is-active", !!cat && t.dataset.cat===cat)
  );
  const h = HERO[cat]||{title:"검색 결과",desc:""};
  document.getElementById("hero-title").textContent = q ? `"${q}" 검색 결과` : h.title;
  document.getElementById("hero-desc").textContent  = q ? "" : h.desc;
  // 범위 안내: 카테고리 목록일 때만 표시 (검색 결과 화면에서는 숨김)
  document.getElementById("hero-scope").classList.toggle("show", !q && !!HERO[cat]);
  renderChipBar();
  renderCards();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* =============================================
   SECTION: js-chip-bar
============================================= */
function getChips(cat) {
  if(cat==="제품 모델") return [
    {key:"전체",label:"전체"},
    {key:"A&ultima",label:"A&ultima"},
    {key:"PD series",label:"PD series"},
    {key:"Heritage",label:"Heritage"},
    {key:"Classic",label:"Classic"}
  ];
  if(cat==="기능 히스토리") return [
    {key:"전체",label:"전체"},
    {key:"A&ultima",label:"A&ultima"},
    {key:"PD series",label:"PD series"},
    {key:"RC",label:"RC"},
    {key:"Research",label:"Research"},
    {key:"Others",label:"Others"}
  ];
  if(cat==="용어사전") return [
    {key:"전체",label:"전체"},
    {key:"HW",label:"HW"},
    {key:"SW",label:"SW"},
    {key:"Local",label:"Local"},
    {key:"Service",label:"Service"},
    {key:"Feature",label:"Feature"},
    {key:"Dev",label:"Dev"}
  ];
  return [];
}

function renderChipBar() {
  const bar=document.getElementById("chip-bar");
  const wasSearchOpen=bar.classList.contains("search-open");
  bar.innerHTML="";
  bar.style.cssText="";
  const chips=getChips(S.cat);

  // 탭 스크롤 영역
  const scroll=document.createElement("div");
  scroll.id="chip-scroll";
  chips.forEach(c=>{
    let cnt;
    if(S.cat==="용어사전"){
      cnt = c.key==="전체" ? DATA_glossary.length : DATA_glossary.filter(d=>d.glossTab===c.key).length;
    } else {
      cnt=DATA.filter(d=>d.category===S.cat&&(c.key==="전체"||d.models.includes(c.key)||(d.labels&&d.labels.includes(c.key)))).length;
    }
    const btn=document.createElement("button");
    btn.className="chip-btn"+(S.chip===c.key?" is-active":"");
    btn.dataset.chip=c.key;
    btn.innerHTML=`${c.label} <span class="cnt">${cnt}</span>`;
    btn.addEventListener("click",()=>{
      S.chip=c.key;
      if(S.cat==="용어사전") S.glossTab=c.key;
      if(typeof gtag!=="undefined"){
        gtag("event","select_filter",{filter_name:c.key,category:S.cat});
      }
      updateChips();renderCards();
    });
    scroll.appendChild(btn);
  });
  bar.appendChild(scroll);

  // 검색 버튼 — 우측 고정
  const sw=document.createElement("div");
  sw.id="chip-search-wrap";
  sw.style.cssText="position:relative;flex-shrink:0;";
  sw.innerHTML=`<svg class="csi" width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="4"/><path d="M9 9l3 3"/></svg><input id="chip-search" type="search" placeholder="페이지 내 검색" autocomplete="off"/><span id="chip-search-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg></span>`;

  // 원형 X — 필드 안에 위치
  const clearBtn=document.createElement("button");
  clearBtn.id="chip-search-clear";
  clearBtn.innerHTML=`<svg width="12" height="12" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>`;
  sw.appendChild(clearBtn);
  bar.appendChild(sw);

  // 그냥 X — 필드 밖 우측 (탭으로 돌아가기)
  const closeBtn=document.createElement("button");
  closeBtn.id="chip-search-close";
  closeBtn.innerHTML=`<svg width="16" height="16" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>`;
  bar.appendChild(closeBtn);

  // 아이콘 클릭 → 검색 확장
  sw.addEventListener("click", ()=>{
    if(bar.classList.contains("search-open")) return;
    bar.classList.add("search-open");
    const inp=document.getElementById("chip-search");
    if(inp){ inp.focus(); }
  });
  // 원형 X — 텍스트만 지우기
  clearBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    S.q="";
    const inp=document.getElementById("chip-search");
    if(inp){ inp.value=""; inp.focus(); }
    clearBtn.classList.remove("show");
    renderCards();
  });
  // 밖 X — 검색 닫고 탭으로 복귀
  closeBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    bar.classList.remove("search-open");
    S.q="";
    const inp=document.getElementById("chip-search");
    if(inp) inp.value="";
    renderCards();
  });

  const inp=document.getElementById("chip-search");
  if(inp){inp.value=S.q||"";clearBtn.classList.toggle("show",!!inp.value);inp.addEventListener("input",()=>{S.q=inp.value;clearBtn.classList.toggle("show",!!inp.value);renderCards();if(S.q.length>=1&&typeof gtag!=="undefined"){gtag("event","search",{search_term:S.q,search_location:"category_"+S.cat});}});}

  // 재렌더링 후 검색 열린 상태 복원
  if(wasSearchOpen){
    bar.classList.add("search-open");
    if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }
}

function updateChips(){
  document.querySelectorAll(".chip-btn").forEach(b=>b.classList.toggle("is-active",b.dataset.chip===S.chip));
}

/* =============================================
   SECTION: js-filter + render-cards
============================================= */
function filterData(){
  const q=S.q.trim().toLowerCase();
  return DATA.filter(d=>{
    if(S.cat&&d.category!==S.cat)return false;
    if(S.cat==="용어사전" && S.chip!=="전체" && d.glossTab!==S.chip) return false;
    if(S.chip!=="전체"&&(S.cat==="제품 모델"||S.cat==="기능 히스토리")){
      const inModels = d.models.includes(S.chip);
      const inLabels = d.labels && d.labels.includes(S.chip);
      if(!inModels && !inLabels) return false;
    }
    if(!q)return true;
    return d.title.toLowerCase().includes(q);
  }).sort((a,b)=>{
    const titleCmp = (x,y) => x.title.localeCompare(y.title, ["en","ko"], {sensitivity:"base",numeric:true});
    if(!q){
      const dateDiff = b.date.replace(/\./g,"").localeCompare(a.date.replace(/\./g,""));
      if(dateDiff !== 0) return dateDiff;
      return titleCmp(a,b);
    }
    const score = d => {
      const lq = q;
      if(d.title.toLowerCase().includes(lq)) return 3;
      const tagModel = [...d.tags,...d.models,...(d.labels||[])].join(" ").toLowerCase();
      if(tagModel.includes(lq)) return 2;
      if((d.desc||"").toLowerCase().includes(lq)) return 1;
      return 0;
    };
    const diff = score(b) - score(a);
    if(diff !== 0) return diff;
    const dateDiff = b.date.replace(/\./g,"").localeCompare(a.date.replace(/\./g,""));
    if(dateDiff !== 0) return dateDiff;
    return titleCmp(a,b);
  });
}

function renderCards(){
  const list=document.getElementById("card-list");
  const empty=document.getElementById("empty");
  list.innerHTML="";
  const items=filterData();
  document.getElementById("count-num").textContent=items.length;
  if(items.length===0){empty.classList.add("show");if(S.q&&S.q.length>=1&&typeof gtag!=="undefined"){gtag("event","search_no_results",{search_term:S.q,category:S.cat});}return;}
  empty.classList.remove("show");
  const q=S.q.trim().toLowerCase();
  const MAX_MODELS=3;

  // 제품 모델: 썸네일 그리드
  if(S.cat==="제품 모델"){
    list.classList.add("is-thumb-grid");
    items.forEach(d=>{
      const el=document.createElement("div");
      el.className="card-thumb";el.setAttribute("role","listitem");el.setAttribute("tabindex","0");el.setAttribute("data-id",d.id);
      // 썸네일 이미지: _thumb 파일 우선, 없으면 images[0] 사용
      const thumbImg = d.images && d.images.find(img => img.src.toLowerCase().includes('_thumb'));
      const thumbFallback = (!d.noThumb && d.images && d.images.length) ? d.images[0] : null;
      const thumbSrc = thumbImg ? thumbImg.src : (thumbFallback ? thumbFallback.src : null);
      const thumbAlt = thumbImg ? thumbImg.alt : (thumbFallback ? thumbFallback.alt : d.title);
      const imgHtml = thumbSrc
        ? `<img src="${thumbSrc}" alt="${thumbAlt}" loading="lazy"/>`
        : `<div class="card-thumb-img-placeholder"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="6" y="8" width="28" height="22" rx="2"/><path d="M6 24l8-7 6 5 4-3 10 8"/><circle cx="27" cy="15" r="3"/></svg></div>`;
      // 모델 배지
      const vis=d.models.slice(0,MAX_MODELS);
      const hid=d.models.length-vis.length;
      const modelBadges=vis.map(m=>`<span class="badge ${DAP_CLS[m]||'b-more'}">${m}</span>`).join("")
        +(hid>0?`<span class="badge b-more">+${hid}</span>`:"");
      // 날짜 포맷
      const dp=d.date.split(".");
      const fmtDate=dp.length===3?`${dp[0]}. ${parseInt(dp[1])}. ${parseInt(dp[2])}.`:d.date;
      el.innerHTML=`
        <div class="card-thumb-img">${imgHtml}</div>
        <div class="card-thumb-body">
          <div class="card-thumb-label">${modelBadges}</div>
          <div class="card-thumb-title">${hl(d.title,q)}</div>
          <div class="card-thumb-meta">
            <span class="card-thumb-meta-author">${d.author}</span>
            <span class="card-thumb-meta-sep">·</span>
            <span>${fmtDate}</span>
          </div>
        </div>
      `;
      el.addEventListener("click",()=>openDetail(d.id));
      el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")openDetail(d.id);});
      list.appendChild(el);
    });
    return;
  }

  // 그 외 카테고리: 기존 카드 리스트
  list.classList.remove("is-thumb-grid");
  items.forEach(d=>{
    const el=document.createElement("div");
    el.className="card";el.setAttribute("role","listitem");el.setAttribute("tabindex","0");el.setAttribute("data-id",d.id);
    // 상단: 탭명 배지(labels) + 반영모델 배지(models)
    const labelBadges = d.labels
      ? d.labels.map(l=>`<span class="badge ${LABEL_CLS[l]||'b-more'}">${l}</span>`).join("")
      : "";
    const vis=d.models.slice(0,MAX_MODELS);
    const hid=d.models.length-vis.length;
    const divider=(labelBadges&&vis.length>0)?`<span class="badge-divider"></span>`:"";
    const modelBadges=labelBadges+divider+vis.map(m=>`<span class="badge ${DAP_CLS[m]||'b-more'}">${m}</span>`).join("")
      +(hid>0?`<span class="badge b-more">+${hid}</span>`:"");
    const topRow=(vis.length>0||labelBadges||!S.cat)
      ?`<div class="card-top"><div class="card-models-row">${!S.cat?`<span class="badge ${CAT_CLS[d.category]||'b-more'}">${d.category}</span>${(vis.length>0||labelBadges)?'<span class="badge-divider"></span>':''}`:''  }${modelBadges}</div></div>`
      :"";
    const dp=d.date.split(".");
    const fmtDate=dp.length===3?`${dp[0]}. ${parseInt(dp[1])}. ${parseInt(dp[2])}.`:d.date;
    el.innerHTML=`
      ${topRow}
      <div class="card-title">${hl(d.title,q)}</div>
      <div class="card-meta">
        <span class="card-meta-author">${d.author}</span>
        <span class="card-meta-sep">·</span>
        <span class="card-meta-date">${fmtDate}</span>
      </div>
    `;
    el.addEventListener("click",()=>openDetail(d.id));
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")openDetail(d.id);});
    list.appendChild(el);
  });
}

/* =============================================

  // 태그 — # prefix, 클릭 시 goTag

  const links = d.links || [];

        return `<button class="dlink" onclick="closeDetail();goList('용어사전','${q}')">${icon}${l.label}</button>`;

  document.getElementById("d-links-wrap").style.display=links.length?"":"none";

function closeDetail(rerender=true){
  const dv=document.getElementById("detail");dv.classList.remove("show");dv.setAttribute("aria-hidden","true");
  // GA4 체류시간 기록
  if(window._docOpenTime && typeof gtag!=="undefined"){
    const sec = Math.round((Date.now()-window._docOpenTime)/1000);
    const d = DATA.find(x=>x.id===window._docOpenId);
    gtag("event","document_read_time",{
      document_id: window._docOpenId,
      document_title: d?d.title:"",
      seconds_spent: sec
    });
    window._docOpenTime=null;
  }
  if(!rerender)return;
  S.openId=null;
  ["card-list","count-row","hero"].forEach(i=>document.getElementById(i).style.display="");
  document.getElementById("chip-bar").style.display="flex";
  renderGlossSubtab();
  renderChipBar();
  renderCards();
  window.scrollTo({top:0,behavior:"smooth"});
}

function hl(text,q){
  if(!q)return text;
  return text.replace(new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi"),"<mark>$1</mark>");
}

/* =============================================
   SECTION: js-render-body
   body 텍스트 → HTML 변환
   - ■ (개수 무관) 으로 시작 → 소제목 H2 (18px)
   - | 로 시작하는 블록 → 테이블
   - 일반 텍스트 → pre-wrap 단락
============================================= */
function renderBody(text) {
  const lines = text.split('\n');
  const result = [];
  let i = 0;
  let inPre = false;

  function closePre() {
    if (inPre) { result.push('</span>'); inPre = false; }
  }
  function openPre() {
    if (!inPre) { result.push('<span class="body-pre">'); inPre = true; }
  }
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    // ── 그리드 카드: !!grid-start!! ~ !!grid-end!!
    if (trimmed === '!!grid-start!!') {
      closePre();
      i++;
      const items = [];
      while (i < lines.length && lines[i].trim() !== '!!grid-end!!') {
        const gl = lines[i].trim();
        if (gl.includes('::')) {
          const sep = gl.indexOf('::');
          const rawContent = gl.slice(sep + 2).trim();
          // \n → 줄바꿈, / → 줄바꿈
          const content = escHtml(rawContent)
            .replace(/\\n/g, '\n')
            .replace(/\s*\/\s*/g, '\n');
          items.push({
            title: escHtml(gl.slice(0, sep).trim()),
            content
          });
        }
        i++;
      }
      i++; // skip !!grid-end!!
      let html = '<div class="body-grid">';
      items.forEach(it => {
        html += `<div class="body-grid-item"><span class="body-grid-title">${it.title}</span><span class="body-grid-content">${it.content}</span></div>`;
      });
      html += '</div>';
      result.push(html);
      continue;
    }

    // ── 이미지 마커: !!img:파일명|대체텍스트!! (연속 2개 → 2단 그리드)
    if (/^!!img:.+!!$/.test(trimmed)) {
      closePre();
      const parseImg = (raw) => {
        const inner = raw.trim().slice(6, -2);
        const [src, alt=''] = inner.split('|');
        return {src: src.trim(), alt: alt.trim()};
      };
      const nextLine = (lines[i+1] || '').trim();
      if (/^!!img:.+!!$/.test(nextLine)) {
        const img1 = parseImg(trimmed);
        const img2 = parseImg(nextLine);
        result.push(`<div class="body-img-row"><div class="body-img-col"><img src="${img1.src}" alt="${img1.alt}" loading="lazy"/><span class="body-img-caption">${img1.alt}</span></div><div class="body-img-col"><img src="${img2.src}" alt="${img2.alt}" loading="lazy"/><span class="body-img-caption">${img2.alt}</span></div></div>`);
        i += 2;
      } else {
        const {src, alt} = parseImg(trimmed);
        result.push(`<div class="body-img-wrap"><img src="${src}" alt="${alt}" loading="lazy" style="max-width:100%;border-radius:8px;margin:12px 0;display:block;"/></div>`);
        i++;
      }
      continue;
    }

    // ── 소제목: ■ 개수로 h1/h2/h3 구분
    if (/^■+/.test(trimmed)) {
      closePre();
      const count = trimmed.match(/^■+/)[0].length;
      const t = escHtml(trimmed.replace(/^■+\s*/, ''));
      const cls = count >= 3 ? 'body-h1' : 'body-h2';
      result.push(`<span class="${cls}">${t}</span>`);
      i++;
      // 헤딩 바로 뒤 빈 줄 스킵
      while (i < lines.length && lines[i].trim() === '') i++;
      continue;
    }

    // ── 테이블 equal 마커: !!table-equal!! 바로 다음 표에만 1:1 비율 적용
    if (trimmed === '!!table-equal!!') {
      closePre();
      i++;
      const tableLines = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      const filtered = tableLines.filter(l => !/^\s*\|[\s\-|:]+\|\s*$/.test(l));
      let html = '<table class="table-col-equal">';
      filtered.forEach((row, idx) => {
        const cells = row.trim().replace(/^\||\|$/g,'').split('|');
        const tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
      });
      html += '</table>';
      result.push(html);
      continue;
    }

    // ── 테이블: | 로 시작하는 연속 줄
    if (trimmed.startsWith('|')) {
      closePre();
      const tableLines = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      const filtered = tableLines.filter(l => !/^\s*\|[\s\-|:]+\|\s*$/.test(l));
      let html = '<table>';
      filtered.forEach((row, idx) => {
        const cells = row.trim().replace(/^\||\|$/g,'').split('|');
        const tag = idx === 0 ? 'th' : 'td';
        html += '<tr>' + cells.map(c => `<${tag}>${c.trim()}</${tag}>`).join('') + '</tr>';
      });
      html += '</table>';
      result.push(html);
      continue;
    }

    // ── 일반 텍스트
    openPre();
    const escaped = trimmed === '' ? '' : escHtml(line);
    result.push(escaped + '\n');
    i++;
  }
  closePre();
  return result.join('');
}


// 홈 검색 + 자동완성
(function(){
  const hs   = document.getElementById("home-search");
  const hc   = document.getElementById("home-clear");
  const ac   = document.getElementById("home-autocomplete");
  const MAX  = 5;
  const HIST_MAX = 10;
  const HIST_MAX_SHOW = 5;
  const HIST_KEY = "ak_search_history";
  let focusIdx = -1;
  let acItems  = [];

  const CAT_LABEL = {
    "제품 모델":"제품",
    "기능 히스토리":"UX 히스토리",
    "디자인 가이드":"디자인",
    "용어사전":"용어"
  };

  /* ── 히스토리 유틸 ── */
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); } catch(e) { return []; }
  }
  function saveHistory(q) {
    if (!q || q.trim().length === 0) return;
    const q2 = q.trim();
    let hist = loadHistory().filter(h => h !== q2);
    hist.unshift(q2);
    hist = hist.slice(0, HIST_MAX);
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }
  function removeHistory(q) {
    const hist = loadHistory().filter(h => h !== q);
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  }
  function clearHistory() {
    localStorage.removeItem(HIST_KEY);
  }

  /* ── 히스토리 드롭다운 ── */
  function renderHistory() {
    const hist = loadHistory();
    ac.innerHTML = "";
    if (hist.length === 0) { ac.classList.remove("show"); return; }

    const header = document.createElement("div");
    header.className = "ac-history-header";
    header.innerHTML = `<span class="ac-history-label">최근 검색어</span><button class="ac-history-clear">전체 삭제</button>`;
    header.querySelector(".ac-history-clear").addEventListener("mousedown", e => {
      e.preventDefault();
      clearHistory();
      closeAC();
    });
    ac.appendChild(header);

    const ITEM_H = 46;
    const scrollWrap = document.createElement("div");
    scrollWrap.style.cssText = `overflow-y:auto;max-height:${ITEM_H * HIST_MAX_SHOW}px;`;

    hist.forEach(q => {
      const item = document.createElement("div");
      item.className = "ac-item";
      item.innerHTML = `
        <div class="ac-item-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="7" cy="7" r="5.5"/>
            <path d="M7 4.5V7l2 1.5"/>
          </svg>
        </div>
        <div class="ac-item-content">
          <div class="ac-item-title">${escHtml(q)}</div>
        </div>
        <button class="ac-item-del" aria-label="삭제">
          <svg width="9" height="9" viewBox="0 0 9 9" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 1l7 7M8 1L1 8"/></svg>
        </button>
      `;
      item.querySelector(".ac-item-del").addEventListener("mousedown", e => {
        e.preventDefault();
        e.stopPropagation();
        removeHistory(q);
        renderHistory();
      });
      item.addEventListener("mousedown", e => {
        if (e.target.closest(".ac-item-del")) return;
        e.preventDefault();
        hs.value = q;
        hc.classList.add("show");
        saveHistory(q);
        closeAC();
        goList("", q);
      });
      scrollWrap.appendChild(item);
    });

    ac.appendChild(scrollWrap);
    ac.classList.add("show");
  }

  function highlight(text, q) {
    if (!q) return escHtml(text);
    const escaped = escHtml(text);
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    return escaped.replace(re, m => `<mark>${m}</mark>`);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function getMatches(q) {
    const lq = q.toLowerCase();
    const scored = DATA.map(d => {
      const title = d.title.toLowerCase();
      if (title.includes(lq))   return { d, score: 2 };
      return null;
    }).filter(Boolean);
    scored.sort((a,b) => b.score - a.score || b.d.date.localeCompare(a.d.date));
    return scored.slice(0, MAX).map(x => x.d);
  }

  function renderAC(q) {
    const matches = getMatches(q);
    acItems = matches;
    focusIdx = -1;
    ac.innerHTML = "";

    if (matches.length === 0) {
      ac.classList.remove("show");
      return;
    }

    matches.forEach((d, i) => {
      const item = document.createElement("div");
      item.className = "ac-item";
      item.setAttribute("role","option");
      const label = CAT_LABEL[d.category] || d.category;
      item.innerHTML = `
        <div class="ac-item-icon">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6">
            <circle cx="6.5" cy="6.5" r="4.5"/><path d="M10.5 10.5L14 14"/>
          </svg>
        </div>
        <div class="ac-item-content">
          <div class="ac-item-title">${highlight(d.title, q)}</div>
          ${d.desc ? `<div class="ac-item-meta">${escHtml(d.desc.slice(0,50))}${d.desc.length>50?"…":""}</div>` : ""}
        </div>
        <span class="ac-item-badge">${label}</span>
      `;
      item.addEventListener("mousedown", e => {
        e.preventDefault();
        selectItem(d);
      });
      ac.appendChild(item);
    });

    const total = DATA.filter(d =>
      d.title.toLowerCase().includes(q.toLowerCase())
    ).length;
    if (total > 0) {
      const footer = document.createElement("div");
      footer.className = "ac-footer";
      footer.innerHTML = `
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="6" cy="6" r="4.5"/><path d="M9.5 9.5L13 13"/>
        </svg>
        <span><strong>"${escHtml(q)}"</strong> 전체 결과 ${total}개 보기</span>
      `;
      footer.addEventListener("mousedown", e => {
        e.preventDefault();
        saveHistory(q);
        closeAC();
        goList("", q);
      });
      ac.appendChild(footer);
    }

    ac.classList.add("show");
  }

  function selectItem(d) {
    saveHistory(d.title);
    closeAC();
    hs.value = d.title;
    hc.classList.add("show");
    S.chip = "전체"; S.q = ""; S.cat = d.category;
    document.body.className = "is-list";
    openDetail(d.id, "is-home");
  }

  function closeAC() {
    ac.classList.remove("show");
    acItems = [];
    focusIdx = -1;
  }

  function setFocus(idx) {
    const items = ac.querySelectorAll(".ac-item");
    items.forEach(el => el.classList.remove("is-focused"));
    if (idx >= 0 && idx < items.length) {
      items[idx].classList.add("is-focused");
      focusIdx = idx;
    } else {
      focusIdx = -1;
    }
  }

  // input 이벤트
  hs.addEventListener("input", () => {
    const v = hs.value.trim();
    hc.classList.toggle("show", !!v);
    if (v.length >= 1) {
      renderAC(v);
      if(typeof gtag!=="undefined"){
        gtag("event","search",{search_term:v,search_location:"home"});
      }
    } else {
      renderHistory();
    }
  });

  // 포커스 시 히스토리 표시
  hs.addEventListener("focus", () => {
    if (!hs.value.trim()) renderHistory();
  });

  // 키보드 네비게이션
  hs.addEventListener("keydown", e => {
    const items = ac.querySelectorAll(".ac-item");
    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (!ac.classList.contains("show")) {
        if (hs.value.trim()) renderAC(hs.value.trim());
        else renderHistory();
        return;
      }
      setFocus(Math.min(focusIdx + 1, items.length - 1));
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      setFocus(Math.max(focusIdx - 1, -1));
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (focusIdx >= 0 && focusIdx < acItems.length) {
        selectItem(acItems[focusIdx]);
      } else {
        const v = hs.value.trim();
        if (v) { saveHistory(v); closeAC(); goList("", v); }
      }
    } else if (e.key === "Escape") {
      closeAC();
    }
  });

  // 포커스 잃으면 닫기
  hs.addEventListener("blur", () => {
    setTimeout(closeAC, 150);
  });

  // clear 버튼
  hc.addEventListener("click", () => {
    hs.value = "";
    hc.classList.remove("show");
    closeAC();
    hs.focus();
  });
})();

/* =============================================
   SECTION: js-deeplink-router
   주소창 해시(#/doc/38 등)로 특정 항목 직접 진입/공유 지원
============================================= */
function routeFromHash() {
  const h = location.hash || "";
  // 상세: #/product/SP4000 (제품명) 또는 #/uxhistory/3 (번호) — 카테고리 범위로 조회
  const dm = h.match(/^#\/([^\/]+)\/(.+?)\/?$/);
  if (dm && SLUG_CAT[dm[1]]) {
    const cat = SLUG_CAT[dm[1]];
    const key = decodeURIComponent(dm[2]);
    let d = /^\d+$/.test(key) ? DATA.find(x => x.category === cat && String(x.id) === key) : null;
    if (!d) d = DATA.find(x => x.category === cat && x.title === key); // 제품명 키
    if (!d) return false;
    replaceHistory({page:"list", cat, q:""});
    _goList(cat, "", false);
    openDetail(d.id, "is-list");
    return true;
  }
  // 카테고리: #/product 처럼 단일 슬러그면 목록으로 (구 #/list/product 도 아래에서 호환 처리)
  const cm = h.match(/^#\/([^\/]+)\/?$/);
  if (cm && SLUG_CAT[cm[1]]) {
    const cat = SLUG_CAT[cm[1]];
    _goList(cat, "", false);
    replaceHistory({page:"list", cat, q:""});
    return true;
  }
  const m = h.match(/^#\/(doc|tag|list|search)\/(.*)$/);
  if (!m) return false;
  const kind = m[1];
  const val = decodeURIComponent(m[2]);

  if (kind === "doc") {
    const id = Number(val);
    const d = DATA.find(x => x.id === id);
    if (!d) return false;
    // 뒤로가기 시 해당 카테고리 목록으로 복귀하도록 목록을 먼저 깔고 상세를 push
    replaceHistory({page:"list", cat:d.category, q:""});
    _goList(d.category, "", false);
    openDetail(id, "is-list");
    return true;
  }
  if (kind === "tag") {
    _goTag(val, false);
    replaceHistory({page:"tag", tag:val});
    return true;
  }
  if (kind === "list") {
    const cat = slugToCat(val);
    _goList(cat, "", false);
    replaceHistory({page:"list", cat, q:""});
    return true;
  }
  if (kind === "search") {
    _goList("", val, false);
    replaceHistory({page:"list", cat:"", q:val});
    return true;
  }
  return false;
}
// 최초 진입 시 공유된 해시 링크가 있으면 해당 화면으로 라우팅
routeFromHash();
</script>
